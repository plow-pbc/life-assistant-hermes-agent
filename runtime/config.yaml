# The declarative half of an instance's home — everything that is a deliberate
# choice for this deployment. Keys equal to the image's own defaults are
# deliberately absent, so the pinned image supplies its current defaults rather
# than a frozen snapshot of them.
#
# Gmail and Slack are NOT reachable on this instance at all, and their absence
# is no longer a routing detail. They used to arrive through the
# plow-connectors skill, replayed from `skills.tsv`; that file is now empty,
# so `agent-mgr deploy <agent>` installs no skill and there is nothing here
# or in the home that reaches a person's mail.
#
# Google Calendar arrives another way: a vendored `gog` driven through Latch —
# i.e. through the mcp_server below rather than a connector skill, which is
# why nothing is being held open for it here (plow-pbc/latch#183). ALL SIX
# life-dashboard producers are live: the three calendar producers
# (ld-morning-updates, ld-weekly-digest, ld-calendar-nudge) read through that
# door, ld-morning-triage the Mac's iMessage DB through the same one. See the
# repo README, "No connectors, and what that costs".
# One session per group chat, shared by every participant. The image default
# (true) splits a group thread into per-sender sessions (the 2026-08-30 wrong-
# thread-reply incident), and the plow-chat plugin's config.extra flag never
# reaches the gateway session store — this gateway-level key is the control.
group_sessions_per_user: false
# NOT set here: display.interim_assistant_messages.
#
# Turning it off looked like the structural fix for mid-turn commentary
# reaching the owner, and it made things much worse. Measured, twice: with
# interim delivery off the ENTIRE introduction disappeared -- the pitch, the
# privacy line and the Latch link -- and all the owner received for that turn
# was "Already saved that. Now I'll wait for her next reply."
#
# The reason is that the model writes the real message mid-turn, before its
# last tool call, and a note to itself afterwards. Interim delivery is what
# carries the real message; switching it off deletes that and leaves the note.
# A leaked note is cosmetic. A missing introduction is the product.
#
# So the commentary stays a prompt problem (ld-setup/SKILL.md), and this key
# stays absent until something can suppress notes without suppressing the
# message they were written beside.
# `clarify` is the tool behind the ❓ rows: it renders a blocking menu and stops
# the turn until the owner picks something. In this product nothing is worth
# one -- and it has never been reached deliberately. It is what a turn grabs
# when it cannot find the mechanism it wants, and it arrived three times as the
# entire first thing the agent ever said to a new owner ("❓ placeholder",
# "❓ dummy", a menu asking the owner to name the assistant).
#
# The prompt has forbidden it for as long as those incidents have been known,
# and the ban held right up until a turn was confused, which is exactly when it
# does not. So it is taken away instead: `clarify` is the only tool in its
# toolset, so disabling the toolset removes it and nothing else (measured
# against the image: 21 tools offered, 20 with this set).
agent:
  disabled_toolsets:
    - clarify

# The file-mutation verifier appends a footer to the assistant's FINAL RESPONSE
# whenever a write_file/patch failed during the turn -- container paths, the
# exception, a bulleted list. It is a developer's safety net against a model
# claiming edits landed when they did not, and in a terminal it is exactly
# right. Here the final response is a text message to a person who is being
# introduced to their assistant, and one arrived inside that introduction:
# a `⚠️ File-mutation verifier:` block naming /var/lib/hermes/ld/... and a
# JSONDecodeError, mid-sentence.
#
# `display.file_mutation_verifier` (run_agent.py, default true) is the gate;
# HERMES_FILE_MUTATION_VERIFIER overrides it. The failures it reports still
# reach the log, where whoever needs them is looking -- and unlike
# `display.interim_assistant_messages`, which was tried and deleted the real
# message, this suppresses only the appended footer.
display:
  file_mutation_verifier: false

model:
  default: gpt-5.6-sol
  provider: openai-codex
# The main model's own escape hatch, for the 503 bursts a ChatGPT-account codex
# sheds under load. The image classifies those as FailoverReason.overloaded and
# fails over on the third attempt -- but only into THIS top-level key, so with
# none configured the loop exhausts its three retries in ~15s and the owner
# reads a provider-failed message instead of an answer.
#
# Same target and reasoning as auxiliary.compression below: gpt-5.5 is the only
# other id this account serves, on the instance's own auth, so no new credential.
fallback_providers:
- provider: openai-codex
  model: gpt-5.5
# Outcome memories need room: the image default (2200 chars, ~800 tokens) fills
# with durable technique notes, so one-line records of consequential actions
# (payments, sends, bookings) lose the consolidation fight — the 2026-08-31
# incident where a sibling session denied a completed $1,500 transfer. ~2.7x
# gives the outcome journal room; SOUL.md owns the write-an-outcome rule, and
# agent-mgr's template carries the same key for future agents (agent-mgr#105).
# Key name verified against the image source: agent_init.py reads
# mem_config.get("memory_char_limit", 2200).
memory:
  memory_char_limit: 6000
# On a full-budget timeout the aux client skips the same-provider retry for
# compression and falls back -- but by default there is nowhere to land, so an
# oversized session freezes and every turn re-stalls (~30h, 2026-08-31).
# A second model on the instance's own codex auth closes it, no new credential.
#
# The model is pinned, not free-form: a ChatGPT-account codex serves ONLY
# gpt-5.6-sol and gpt-5.5; every other id 400s. Verify a swap by the fallback
# log lines, never the return value -- the implicit main-model fallback reports
# success for a model the account actually rejected.
#
# No task-level `timeout` on purpose. The image floors a config-derived
# compression timeout at 300s so a slow reasoning summary is not cut off into
# the deterministic context marker (#54915) -- a lower value is silently raised,
# and setting one that DID bite would re-introduce that bug. A genuinely dead
# stream is caught at 60s by the no-progress timeout, not by this budget.
# The chain entry keeps its own 300s: without one it inherits the 30s auxiliary
# default, far too short for a summary.
auxiliary:
  compression:
    fallback_chain:
    - provider: openai-codex
      model: gpt-5.5
      timeout: 300

mcp_servers:
  # Plow Latch, reached over the Plow relay: the browser and the filesystem this
  # agent drives are THE INSTANCE OWNER's Mac, not this container. The relay authorises the
  # connection and tells the Mac who is asking; the Mac authorises each action.
  #
  # Same shape the property agent uses, and the same reason: a URL and a bearer
  # header, both from the dotenv. The credential never appears in the URL — a
  # URL is logged in places a header is not.
  #
  # This is the ONLY mcp_server here. Hostex and Seam stay absent: no PMS
  # access, no lock control. The device this reaches is that owner's own.
  plow:
    url: https://api.plow.co/v1/relay/devices/${DOMO_DEVICE_UID}/mcp
    headers:
      Authorization: Bearer ${DOMO_MCP_TOKEN}
    enabled: true
plugins:
  enabled:
  - plow-chat-platform
  entries:
    plow-chat-platform:
      # The plugin registers the platform plus its Plow-specific group-send and
      # owner trust tools. Neither replaces an image tool. Denying overrides
      # keeps a future name collision from silently shadowing one, which would
      # be invisible from this file.
      allow_tool_override: false
platforms:
  plow_chat:
    enabled: true
    # No instance group prompts or trust flag. Plow's owner-scoped Chat resource
    # is the durable preference and the shared plugin refreshes it before each
    # turn, so dashboard and agent writes take effect without a deploy.
