# The declarative half of ~/.hermes-rowan — everything that is a deliberate
# choice for this deployment. Keys equal to the image's own defaults are
# deliberately absent, so the pinned image supplies its current defaults rather
# than a frozen snapshot of them.
#
# Gmail, Google Calendar and Slack are NOT here: they are reached through the
# plow-connectors skill, which calls the Plow connector REST API with the
# gateway's own PLOW_CHAT_TOKEN. No second credential, no stdio server —
# `agent-mgr restore rowan` replays `skills.tsv`, which is the whole delivery
# for those.
model:
  default: gpt-5.5
  provider: openai-codex
mcp_servers:
  # Plow Latch, reached over the Plow relay: the browser and the filesystem this
  # agent drives are ROWAN's Mac, not this container. The relay authorises the
  # connection and tells the Mac who is asking; the Mac authorises each action.
  #
  # Same shape the property agent uses, and the same reason: a URL and a bearer
  # header, both from the dotenv. The credential never appears in the URL — a
  # URL is logged in places a header is not.
  #
  # This is the ONLY mcp_server here. Hostex and Seam stay absent: no PMS
  # access, no lock control. The device this reaches is Rowan's own.
  latch:
    url: https://api.plow.co/v1/relay/devices/${DOMO_DEVICE_UID}/mcp
    headers:
      Authorization: Bearer ${DOMO_MCP_TOKEN}
    enabled: true
plugins:
  enabled:
  - plow-chat-platform
  entries:
    plow-chat-platform:
      # The plugin registers one platform and no tools. Denying overrides keeps
      # a future plugin change from silently shadowing an image tool of the
      # same name, which would be invisible from this file.
      allow_tool_override: false
platforms:
  plow_chat:
    enabled: true
    # No extra.group_prompts: this agent has one private chat and no groups.
    # The plugin keys group prompts by display name from PLOW_CHAT_GROUP_UIDS,
    # so a prompt naming no configured group is logged and skipped rather than
    # fatal — adding one here before the group exists is a silent no-op.
