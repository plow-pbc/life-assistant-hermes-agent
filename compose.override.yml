# Extra mounts for this agent. agent-mgr's template makes exactly one -- this
# agent's home -- and names this file as where an instance adds its own. This is
# the first override this repo has had.
#
# The skills are mounted, not fetched. Nothing pins them because after the seeds
# are archived nobody else owns them, so `git pull` is the update and
# `git rev-parse HEAD` is the version. plow-pbc/property-hunt-hermes-agent is the
# worked example this follows.
#
# ${AGENT_DIR}, never "./". agent-mgr passes its own templates/compose.yml as the
# FIRST -f, and Compose resolves relative bind paths against that file's
# directory -- so "./" here would mount agent-mgr's templates. AGENT_DIR comes
# from the registry row and is absolute, the same idiom the template uses for
# AGENT_HOME. It is per-row, so a second person's checkout mounts their own.
#
# One line per skill, each landing FLAT at /opt/data/skills/<name>. Two mistakes
# are available here and both are quiet:
#
#   - Mounting a single directory AT /opt/data/skills. That is where
#     `agent-mgr restore` installs whatever skills.tsv names, so a mount over it
#     shadows that install. The file is empty today, but latch#183 refills it,
#     and the failure then would look like a broken connector rather than a
#     shadowed mount.
#   - Nesting under a subdirectory the way property-hunt does
#     (/opt/data/skills/productivity/property-hunt). Property-hunt can nest
#     because nothing inside it names an absolute path. These do: every SKILL.md
#     tells the agent to run /opt/data/skills/ld-<name>/scripts/post_<name>.py,
#     and each wrapper reaches the shared helper with a RELATIVE ../../ld-shared
#     hop off its own realpath. Both only resolve if the three land as siblings
#     directly under /opt/data/skills.
#
# A child path does not shadow its parent -- but shadowing is not the hazard
# here, and the real one costs something. These are NESTED binds: /opt/data is
# already the home bind from agent-mgr's template, so when a target's mountpoint
# does not exist the runtime creates it inside the PARENT BIND'S SOURCE, on the
# host, as root:root. Measured, not predicted: ~/.hermes-sam-property/skills and
# ~/.hermes-mark-property/skills are both root-owned today, created exactly this
# way by property-hunt's own override, while the agent runs as uid 1000.
#
# A root-owned skills/ is one `agent-mgr restore` cannot write into, so the cost
# lands on the day skills.tsv is refilled (latch#183) and reads as a permission
# error nobody attributes to a mount. `mkdir -p $AGENT_HOME/skills` as the agent
# uid before the first `up` is what keeps the parent writable; the leaves under
# it may be root-owned, because restore only needs to create siblings.
# plow-pbc/agent-mgr#44 is the durable fix (and #42 is the same mechanism seen
# from teardown, where the root-owned dirs are what the operator cannot rm).
#
# Subdirectories, never ${AGENT_DIR} itself. The mount -- not git -- is the
# boundary between this repo and the agent, and mounting the checkout root would
# hand the skills directory .git, agent.env, runtime/ and tests/, plus anything
# untracked an operator drops beside them -- `cp .env.example .env` being the
# obvious one. It narrows that exposure rather than removing it: an untracked
# file dropped INSIDE ld-shared/ or a producer still crosses, and
# test_no_credential_file_is_tracked reads `git ls-files`, so it is blind to
# that by construction. What the subdirectory choice actually buys is excluding
# the checkout's own machinery, not untracked files in general.
#
# Read-only: the agent runs these, it does not edit them.
services:
  hermes:
    volumes:
      - ${AGENT_DIR:?set by agent-mgr from the registry}/ld-morning-triage:/opt/data/skills/ld-morning-triage:ro
      - ${AGENT_DIR:?set by agent-mgr from the registry}/ld-morning-updates:/opt/data/skills/ld-morning-updates:ro
      - ${AGENT_DIR:?set by agent-mgr from the registry}/ld-weather:/opt/data/skills/ld-weather:ro
      - ${AGENT_DIR:?set by agent-mgr from the registry}/ld-sports:/opt/data/skills/ld-sports:ro
      - ${AGENT_DIR:?set by agent-mgr from the registry}/ld-shared:/opt/data/skills/ld-shared:ro
      - ${AGENT_DIR:?set by agent-mgr from the registry}/ld-dashboard:/opt/data/skills/ld-dashboard:ro
