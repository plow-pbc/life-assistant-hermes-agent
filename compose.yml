# Rowan's life + family Hermes agent. The fourth in a fleet keyed by purpose —
# sams-str-hermes-agent (rentals), sams-admin-hermes-agent (mail + calendar),
# sams-property-hermes-agent (house hunting) — and the first keyed by a
# different *person*. Each is its own compose project, its own /opt/data, and
# its own .env; this one is also its own Plow account.
#
#   just restore             # config.yaml + a .env skeleton into ~/.hermes-rowan
#   just install-plugin      # the Plow Chat plugin, from the pinned SHA
#   just install-connectors  # Gmail / Calendar / Slack, from the same pinned SHA
#   just activate            # Rowan texts the code, from his phone
#   just up
#   just sign-in             # Rowan completes the device flow, in his browser
# The compose project name, set rather than derived. Without it the project is
# named after the checkout directory, so a numbered-slot clone
# (rowans-life-hermes-agent0) is a DIFFERENT project bound to this same
# ~/.hermes-rowan mount: `docker compose down` run from the other directory
# reports success having stopped nothing.
name: hermes-rowan

services:
  hermes:
    # The upstream image directly, pinned by digest rather than tag. No derived
    # layer: the rentals agent's image adds obsidian-wiki for its guest-operations
    # vault, which this agent has no use for. A tag would re-resolve on every
    # pull, silently changing a large unreviewed surface under a running agent.
    # Bump deliberately:
    #   docker buildx imagetools inspect nousresearch/hermes-agent:latest
    image: nousresearch/hermes-agent@sha256:c84f3494f86ae32d6a82a3b7d56111d712f3d82f75f9744e8ae07668889714c2
    container_name: hermes-rowan
    restart: unless-stopped
    command: ["gateway", "run"]
    volumes:
      # This agent's own home, and the only mount. Deliberately NOT the rentals,
      # admin or property agent's home: each is another agent's live state, and
      # sharing one would hand two gateways a single auth.json and a single
      # dotenv — including one PLOW_CHAT_CHAT_UID, so whichever started last
      # would own the chat.
      #
      # The isolation is asserted in tests rather than left to review because of
      # what is on the other side of it here. The three siblings are all the
      # same operator's agents; this one holds a different person's Plow token,
      # and that token is also what reaches his mail. A copy-paste from a
      # sibling's compose file would cross an account boundary, not an agent one.
      - ~/.hermes-rowan:/opt/data
    environment:
      # Who owns everything in ~/.hermes-rowan. s6 remaps the hermes user to
      # these at boot and chowns the data directory, so a wrong value does not
      # just affect new files — it re-owns this agent's live state in place.
      #
      # No default, deliberately. The rentals repo learned this the expensive
      # way: a 501:20 fallback (the first user on macOS, and nobody on this
      # Linux host) rewrote all of that agent's home from a shell that had not
      # exported them. `just` exports both; otherwise compose stops here, which
      # is the point.
      - HERMES_UID=${HERMES_UID:?set it to the host uid, or run via just}
      - HERMES_GID=${HERMES_GID:?set it to the host gid, or run via just}
      # The host's zone, matching the three siblings. Confirm Rowan's actual
      # timezone: a life assistant reads "tomorrow morning" off this, so a wrong
      # value is wrong in the one place this agent is for.
      - TZ=America/Los_Angeles
      # No credentials here, deliberately, and this is the whole contract for
      # them: the gateway reads /opt/data/.env — which is ~/.hermes-rowan/.env
      # through the mount above. Passing them here instead would interpolate
      # from the shell or a repo-root .env that no recipe writes, so following
      # the documented bring-up would inject empty strings that can shadow the
      # real values.
    # No ports. The dashboard stays off: publishing it means binding 0.0.0.0
    # inside the container, which Hermes refuses without an auth provider
    # because it holds API keys.
